<div class="govuk-width-container">
  <xuilib-loading-spinner *ngIf="showSpinner$ | async"></xuilib-loading-spinner>
  <main class="govuk-main-wrapper" id="main-content" role="main" tabindex="-1">
    <span id="content" class="govuk-visually-hidden" aria-hidden="true"></span>
    <h1 class="hmcts-page-heading__title govuk-heading-xl">
      Organisation approvals
    </h1>
    <app-notification-banner-component *ngFor="let message of notificationBanners" bannerType="{{message.bannerType}}">{{message.bannerMessage}}</app-notification-banner-component>
    <app-search-organisations-form [searchString]="searchString" (submitForm)="submitSearch($event)"></app-search-organisations-form>

    <!-- The tabs -->
    <div class="govuk-tabs" data-module="govuk-tabs">
      <h2 class="govuk-tabs__title">Contents</h2>

      <ul class="govuk-tabs__list" role="tablist">
        <ng-container *ngFor="let tab of tabs; let i = index">
          <li class="govuk-tabs__list-item" [ngClass]="{'govuk-tabs__list-item--selected': activeRoute === tab.url}" role="presentation">
            <a class="govuk-tabs__tab" routerLinkActive="router-link-active" role="tab"
              [id]="'organisation-tab-' + i" [attr.aria-controls]="'organisation-tab-panel'"
              [routerLink]="tab.url" [attr.aria-selected]="activeRoute === tab.url"
              (click)="refreshBanner()" (keydown)="onTabKeydown($event, i)">
              {{tab.label}}
            </a>
          </li>
        </ng-container>
      </ul>

      <div id="organisation-tab-panel" class="govuk-tabs__panel" role="tabpanel"
        [attr.aria-labelledby]="activeTabId">
        <router-outlet></router-outlet>
      </div>

    </div>
  </main>
</div>
