<div class="govuk-width-container">
  <main id="content" class="govuk-main-wrapper govuk-main-wrapper--l" role="main" tabindex="-1">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <div class="govuk-panel govuk-panel--confirmation">
          <h1 class="govuk-panel__title">
            Organisation update {{accepted ? 'accepted' : 'rejected'}}
          </h1>
        </div>

        <h2 class="govuk-heading-m">What happens next</h2>
        <p class="govuk-body" *ngIf="accepted; else rejectedMessage">
          The requested organisation details are now current.
        </p>
        <ng-template #rejectedMessage>
          <p class="govuk-body">The requested changes have not been applied.</p>
        </ng-template>

        <p class="govuk-body">
          <a class="govuk-link" [routerLink]="['/organisation/updates']">Back to Organisation updates</a>
        </p>
      </div>
    </div>
  </main>
</div>
