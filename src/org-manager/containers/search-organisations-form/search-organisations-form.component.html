<div class="search-organisations-form hmcts-search">
  <form [formGroup]="searchOrgForm" (ngSubmit)="onSubmit()">
    <xuilib-gov-uk-input
      [config]="{label: 'Search', hint: 'Search for an organisation, for example by name or postcode', name: 'search', id: 'search', type: 'text', fullWidth: true}"
      [group]="searchOrgForm"
      (change)="onSearchChange()">
    </xuilib-gov-uk-input>
    <button type="submit" class="govuk-button hmcts-search__button">
      Search
    </button>
    <button type="button" (click)="onReset()" class="govuk-button hmcts-search__button govuk-button--secondary" data-module="govuk-button">
      Reset
    </button>
  </form>
</div>
