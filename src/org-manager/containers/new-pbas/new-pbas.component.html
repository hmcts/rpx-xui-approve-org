@if ({org: orgs$ | async }; as data) {
  <app-identity-bar-component>
    <strong>{{data.org?.name}}</strong>
    <span style="margin-left: 10px; display: inline-block" class="hmcts-badge">
      Approved
    </span>
  </app-identity-bar-component>
  <div class="govuk-width-container">
    <xuilib-hmcts-main-wrapper [summaryErrors]="pbaErrorsHeader$ | async" (backEvent)="onGoBack()">
      @if (!data.org) {
        <h1 class="govuk-heading-xl">Approve new PBA number</h1>
        <h3 class="govuk-heading-s">Loading...</h3>
      }
      @if (data.org && !confirmDecision) {
        <app-new-pbas-info [org]="data.org" [newPBAs]="newPBAs"
          (submitForm)="onContinue()" (newPBA)="setNewPBA($event)">
        </app-new-pbas-info>
      }
      @if (data.org && confirmDecision) {
        <app-new-pbas-confirm [org]="data.org" [newPBAs]="newPBAs"
          (pbaStatusError)="setPbaStatusError($event)">
        </app-new-pbas-confirm>
      }
    </xuilib-hmcts-main-wrapper>
  </div>
}
