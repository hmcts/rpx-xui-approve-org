<div class="govuk-width-container">
  <main id="content" class="govuk-main-wrapper govuk-main-wrapper--l" role="main" tabindex="-1">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">
        <h1 class="govuk-heading-xl">Site map</h1>
        <p class="govuk-body">Use this page to find your way around Approve organisation.</p>

        <ng-container *ngIf="roles$ | async as roles">
          <ng-container *ngIf="roles.includes('prd-admin')">
            <h2 class="govuk-heading-l">Organisation approvals</h2>
            <ul class="govuk-list">
              <li><a class="govuk-link" routerLink="/pending-organisations">Organisations</a></li>
            </ul>
          </ng-container>
          <ng-container *ngIf="roles.includes('cwd-admin')">
            <h2 class="govuk-heading-l">Staff</h2>
            <ul class="govuk-list">
              <li><a class="govuk-link" routerLink="/caseworker-details">Staff details</a></li>
            </ul>
          </ng-container>
        </ng-container>

        <h2 class="govuk-heading-l">Help and information</h2>
        <ul class="govuk-list">
          <li><a class="govuk-link" routerLink="/accessibility">Accessibility statement</a></li>
          <li><a class="govuk-link" routerLink="/cookies">Cookies</a></li>
          <li><a class="govuk-link" routerLink="/privacy-policy">Privacy policy</a></li>
          <li><a class="govuk-link" routerLink="/terms-and-conditions">Terms and conditions</a></li>
          <li><a class="govuk-link" routerLink="/sitemap">Site map</a></li>
        </ul>
      </div>
    </div>
  </main>
</div>
