<header>
  <app-hmcts-global-header [userLoggedIn]="isUserLoggedIn$ | async" [serviceName]="serviceName"
    [navigation]="navigations" (navigate)="onNavigate($event)"></app-hmcts-global-header>
  <app-hmcts-primary-navigation [userLoggedIn]="true" [label]="" [items]="navItems"
    [isBrandedHeader]="isBrandedHeader"></app-hmcts-primary-navigation>
  <div class="govuk-width-container">
    <div class="govuk-phase-banner">
      <p class="govuk-phase-banner__content"><strong class="govuk-tag govuk-phase-banner__content__tag ">
          beta
        </strong>
        <span class="govuk-phase-banner__text">
          This is a new service – your <a class="govuk-link" href="https://www.smartsurvey.co.uk/s/CCDSurvey/"
            target="_blank" rel="noopener noreferrer" aria-description="opens in a new tab">feedback</a> will help us to
          improve it.
        </span>
      </p>
    </div>
  </div>
</header>
