@if (isUserLoggedIn) {
  <nav class="hmcts-primary-navigation" [attr.aria-label]="label">
    <div class="govuk-width-container">
      @if (isBrandedHeader) {
        <div class="govuk-header__logo"></div>
      }
      <ul class="govuk-list">
        @for (item of items; track item) {
          <li class="govuk-header__navigation-item" >
            @if ((isFeatureNavEnabled$(item) | async)) {
              <a class="govuk-header__link" [attr.aria-current]="item.active ? true: null" [routerLink]="item.href">{{item.text}}</a>
            }
          </li>
        }
      </ul>
    </div>
  </nav>
}
